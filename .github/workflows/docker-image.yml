name: Docker Image flask

on:
  push:
    branches: [ "gh-pages" ]
  pull_request:
    branches: [ "gh-pages" ]
  workflow_dispatch: # This enables the manual trigger

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
          working-directory: webserver_for_pdg
          run: docker build . --file Dockerfile --tag ui_v8_flask_webserver:$(date +%s)
