---
name: Docker Image flask
on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch: null

# Add permissions to allow the action to write to the registry
permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up BuildKit (Required for --mount=type=cache & GHA Caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Format architecture tag
      - name: Set Architecture Tag
        id: vars
        run: |
          # GitHub returns 'X64', 'ARM64', etc. 
          # map 'X64' to 'amd64' and lowercase others.
          RAW_ARCH="${{ runner.arch }}"
          if [ "$RAW_ARCH" = "X64" ]; then
            echo "arch=amd64" >> $GITHUB_OUTPUT
          else
            echo "arch=$(echo $RAW_ARCH | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          fi

      # Build & Push using buildx + GitHub Actions Caching
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: webserver_for_pdg
          file: webserver_for_pdg/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ui_v8_flask_webserver:latest-${{ steps.vars.outputs.arch }}
          # Enable GitHub Actions cache backend for BuildKit mounts & layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
	  

# check syntax using https://www.yamllint.com/

# If you later add a step to Push the image to a registry (like Docker Hub), 
# you can use ${{ steps.vars.outputs.arch }} to ensure the tags match.
