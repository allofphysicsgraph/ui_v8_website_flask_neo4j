<!-- https://www.w3schools.com/howto/howto_js_filter_lists.asp -->
Case-insensitive dynamic search of latex as plain text: 
<input type="text" id="latex_input" onkeyup="latex_filter()" placeholder="Search latex (plain text)" size="30">
XOR
<input type="text" id="name_input" onkeyup="name_filter()" placeholder="Search name and description (plain text)" size="30">

<script>
function latex_filter() {
  // Declare variables
  var input, filter, table, tr, td, i, txtValue;
  input = document.getElementById("latex_input");
  filter = input.value.toUpperCase();
  table = document.getElementById("scalar_table");
  tr = table.getElementsByTagName("tr");

  // Loop through all table rows, and hide those who don't match the search query
  for (i = 0; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[1]; // latex column
    console.log(td)
    if (td) {
      txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }
  }
}

function name_filter() {
  // Declare variables
  var input, filter, table, tr, td, i, txtValue;
  input = document.getElementById("name_input");
  filter = input.value.toUpperCase();
  table = document.getElementById("scalar_table");
  tr = table.getElementsByTagName("tr");

  // Loop through all table rows, and hide those who don't match the search query
  for (i = 0; i < tr.length; i++) {
    td_name = tr[i].getElementsByTagName("td")[2]; // name column
    td_desc = tr[i].getElementsByTagName("td")[2]; // name column
    //console.log(td)
    if (td_name) {
      txtValue_name = td_name.textContent || td_name.innerText;
      txtValue_desc = td_desc.textContent || td_desc.innerText;
      if ((txtValue_name.toUpperCase().indexOf(filter) > -1) || 
          (txtValue_desc.toUpperCase().indexOf(filter) > -1)) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }
  }
}
</script>







<!-- and here's another variant that searches two columns: -->

<script>
function select_derivation() {
  console.log('reached function')
  // Declare variables
  var input, filter, table, tr, td, i, txtValue;
  input = document.getElementById('derivation_input');
  filter = input.value.toUpperCase();
  table = document.getElementById("derivation_table");

  tr = table.getElementsByTagName("tr");

  // Loop through all table rows; hide those who don't match the search query
  for (i = 1; i < tr.length; i++) {
    // search a single column:
    // td = tr[i].getElementsByTagName("td")[0]; // name column
    // console.log(td)
    // if (td) {
    //   txtValue = td.textContent || td.innerText;
    //   if (txtValue.toUpperCase().indexOf(filter) > -1) {
    //     tr[i].style.display = "";
    //   } else {
    //     tr[i].style.display = "none";
    //   }
    // }

    // Get the cells for column 0 and column 1
    var td0 = tr[i].getElementsByTagName("td")[0];
    var td1 = tr[i].getElementsByTagName("td")[1];

    // Initialize flags to track if a match is found in either column
    var matchFound = false;

    // Check column 0
    if (td0) {
      txtValue = td0.textContent || td0.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        matchFound = true;
      }
    }

    // If no match found in column 0, check column 1
    if (!matchFound && td1) {
      txtValue = td1.textContent || td1.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        matchFound = true;
      }
    }

    // If a match was found in either column, display the row, otherwise hide it
    if (matchFound) {
      tr[i].style.display = "";
    } else {
      tr[i].style.display = "none";
    }

  }
}
</script>
