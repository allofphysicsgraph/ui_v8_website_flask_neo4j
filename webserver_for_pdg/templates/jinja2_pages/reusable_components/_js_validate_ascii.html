
<!-- https://github.com/allofphysicsgraph/ui_v8_website_flask_neo4j/issues/84 -->
<script>
function validateASCII(inputElement) {
    let value = inputElement.value;
    let asciiOnlyValue = value.replace(/[^\x00-\x7F]/g, ""); // Regex to remove non-ASCII
    
    if (value !== asciiOnlyValue) {
        // Only update (and disrupt the cursor) if a bad character was typed
        inputElement.value = asciiOnlyValue;
    }
}
</script>
