<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live LaTeX Renderer</title>
    <style>
        /* Hide images initially if they have no src */
        img[src=""] { display: none; }
        img { margin-top: 10px; border: 1px solid #ccc; max-width: 100%; }
        .latex-input { width: 300px; padding: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <p> input: <br>
        <input type="text" class="latex-input" data-target="input_latex_image" placeholder="LaTeX here">
        <br><img id="input_latex_image" src="" alt="Latex input">
    </p>

    <p> description: <br>
        <input type="text" class="latex-input" data-target="description_image" placeholder="LaTeX here">
        <br><img id="description_image" src="" alt="description as Latex">
    </p>

    <p> citation: <br>
        <input type="text" class="latex-input" data-target="citation_image" placeholder="LaTeX here">
        <br><img id="citation_image" src="" alt="citation as Latex">
    </p>

    <script type="text/javascript">
        let debounceTimer;

        // Modified function to accept the specific image element to update
        function updateImage(latex_text, imgElement) {
            if (!latex_text.trim()) {
                imgElement.src = "";
                imgElement.style.display = 'none';
                return;
            }

            const url = `/api/v1/resources/png_from_latex/${encodeURIComponent(latex_text)}`;

            fetch(url)
                .then(res => res.json())
                .then(out => {
                    if (out.png_location) {
                        imgElement.src = out.png_location;
                        imgElement.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error("Error fetching the image:", err);
                });
        }

        // Select all inputs with the class 'latex-input'
        const inputFields = document.querySelectorAll('.latex-input');

        // Loop through them and attach the event listener to each
        inputFields.forEach(field => {
            field.addEventListener('input', (e) => {
                const currentText = e.target.value;
                // Find the specific image linked via data-target
                const targetId = field.getAttribute('data-target');
                const imgElement = document.getElementById(targetId);

                clearTimeout(debounceTimer);

                debounceTimer = setTimeout(() => {
                    updateImage(currentText, imgElement);
                }, 500); 
            });
        });
    </script>

</body>  
</html>
